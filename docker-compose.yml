services:
  mysql:
    image: mysql:8.0.36
    container_name: sudo-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: web
      MYSQL_ROOT_PASSWORD: "qwe123!@#"
      MYSQL_USER: user
      MYSQL_PASSWORD: "qwe123!@#"
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pqwe123!@#"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: sudo-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: "qwe123!@#"
      DB_NAME: web
      DB_CONNECTION_LIMIT: 10
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
    container_name: sudo-web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
