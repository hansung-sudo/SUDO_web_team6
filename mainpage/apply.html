<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUDO 지원하기</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  
  <style>
    /* 전체 테마: 다크 모드 & 네온 포인트 */
    :root {
      --bg-color: #09090b; /* 매우 깊은 다크 그레이 */
      --card-bg: rgba(24, 24, 27, 0.6); /* 반투명한 카드 배경 */
      --text-main: #f8fafc;
      --text-muted: #a1a1aa;
      --accent-color: #3b82f6; /* SUDO 메인 컬러로 쓸 수 있는 일렉트릭 블루 */
      --accent-glow: rgba(59, 130, 246, 0.4);
      --border-color: rgba(255, 255, 255, 0.08);
    }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      /* 은은한 배경 그라데이션 조명 효과 */
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 유리 질감(Glassmorphism) 컨테이너 */
    .apply-container {
      width: 100%;
      max-width: 720px;
      margin: 60px 20px;
      padding: 50px 60px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .apply-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .apply-header h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .apply-header p {
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .apply-form {
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .form-section h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      margin: 0;
      letter-spacing: -0.3px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #e4e4e7;
      letter-spacing: -0.2px;
    }

    /* 입력 폼 스타일링 */
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 16px 20px;
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      font-family: inherit;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #52525b;
    }

    /* 포커스 효과 (클릭 시 빛나는 효과) */
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      background-color: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .form-group select option {
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .form-group textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    /* 제출 버튼 */
    .submit-btn {
      margin-top: 10px;
      padding: 20px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.4);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    /* 모바일 반응형 처리 */
    @media (max-width: 768px) {
      .apply-container {
        margin: 20px 16px;
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="apply-container">
    <div class="apply-header">
      <h1>SUDO 지원하기</h1>
      <p>한성대학교 AI응용학과 소모임 SUDO n기 모집</p>
    </div>
    
    <form id="applyForm" class="apply-form">
      <div class="form-section">
        <h2>인적 사항</h2>
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" required placeholder="홍길동">
        </div>
        
        <div class="form-group">
          <label for="studentId">학번</label>
          <input type="text" id="studentId" required placeholder="2312345">
        </div>

        <div class="form-group">
          <label for="major">학과</label>
          <input type="text" id="major" required placeholder="AI응용학과">
        </div>

        <div class="form-group">
          <label for="phone">전화번호</label>
          <input type="tel" id="phone" required placeholder="010-0000-0000">
        </div>

        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" required placeholder="example@hansung.ac.kr">
        </div>
      </div>

      <div class="form-section">
        <h2>지원 정보</h2>
        <div class="form-group">
          <label for="part">지원 파트</label>
          <select id="part" required>
            <option value="" disabled selected>파트를 선택해주세요</option>
            <option value="frontend">프론트엔드</option>
            <option value="backend">백엔드</option>
            <option value="ai">AI / 데이터</option>
            <option value="design">기획 / 디자인</option>
          </select>
        </div>

        <div class="form-group">
          <label for="motivation">지원 동기</label>
          <textarea id="motivation" required placeholder="SUDO에 지원하게 된 동기를 상세히 적어주세요."></textarea>
        </div>

        <div class="form-group">
          <label for="projects">프로젝트 경험</label>
          <textarea id="projects" required placeholder="진행했던 프로젝트나 스터디 경험이 있다면 적어주세요. (없다면 '없음'으로 기재)"></textarea>
        </div>

        <div class="form-group">
          <label for="portfolio">GitHub / 포트폴리오 링크 (선택)</label>
          <input type="url" id="portfolio" placeholder="https://github.com/...">
        </div>
      </div>

      <button type="submit" class="submit-btn">제출하기</button>
    </form>
  </div>

  <script>
    document.getElementById('applyForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitButton = this.querySelector('.submit-btn');

      const formData = {
        name: document.getElementById('name').value,
        studentId: document.getElementById('studentId').value,
        major: document.getElementById('major').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        part: document.getElementById('part').value,
        motivation: document.getElementById('motivation').value,
        projects: document.getElementById('projects').value,
        portfolio: document.getElementById('portfolio').value
      };

      try {
        submitButton.disabled = true;
        submitButton.textContent = '제출 중...';

        const response = await fetch('/api/applicants', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result?.message || '지원서 제출에 실패했습니다.');
        }

        alert('지원서가 성공적으로 제출되었습니다!');
        this.reset();
      } catch (error) {
        alert(error.message || '지원서 제출에 실패했습니다.');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = '제출하기';
      }
    });
  </script>
</body>
</html>
