name: CI/CD — Build, push to OCIR and deploy

on:
  push:
    branches: [ develop ]

env:
  IMAGE: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/sudo_web:${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to OCIR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy on remote host (create compose, pull & restart)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            printf '%s' "${{ secrets.OCIR_PASSWORD }}" | docker login ${{ secrets.OCIR_REGISTRY }} -u "${{ secrets.OCIR_USERNAME }}" --password-stdin
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            printf '%s\n' "version: '3.8'" > ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "services:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "  web:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    image: ${{ env.IMAGE }}" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    ports:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      - \"8080:80\"" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    restart: unless-stopped" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
