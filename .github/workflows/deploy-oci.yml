name: CI/CD — Build, push to OCIR and deploy

on:
  push:
    branches: [ develop ]

env:
  WEB_IMAGE: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/sudo_web:${{ github.sha }}
  BACKEND_IMAGE: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/sudo_backend:${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to OCIR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.WEB_IMAGE }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Deploy on remote host (create compose, pull & restart)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            printf '%s' "${{ secrets.OCIR_PASSWORD }}" | docker login ${{ secrets.OCIR_REGISTRY }} -u "${{ secrets.OCIR_USERNAME }}" --password-stdin
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            printf '%s\n' "version: '3.8'" > ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "services:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "  mysql:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    image: mysql:8.0.36" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    environment:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      MYSQL_DATABASE: web" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      MYSQL_ROOT_PASSWORD: \"qwe123!@#\"" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      MYSQL_USER: user" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      MYSQL_PASSWORD: \"qwe123!@#\"" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    ports:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      - \"13306:3306\"" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    volumes:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      - mysql_data:/var/lib/mysql" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    healthcheck:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"127.0.0.1\", \"-u\", \"root\", \"-pqwe123!@#\"]" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      interval: 10s" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      timeout: 5s" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      retries: 10" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    restart: unless-stopped" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "  backend:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    image: ${{ env.BACKEND_IMAGE }}" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    environment:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      NODE_ENV: production" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      PORT: 3000" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      DB_HOST: mysql" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      DB_PORT: 3306" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      DB_USER: user" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      DB_PASSWORD: \"qwe123!@#\"" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      DB_NAME: web" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      DB_CONNECTION_LIMIT: 10" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    depends_on:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      mysql:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "        condition: service_healthy" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    restart: unless-stopped" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "  web:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    image: ${{ env.WEB_IMAGE }}" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            # bind web host port to 8080 to avoid colliding with services already using port 80
            printf '%s\n' "    ports:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      - \"8080:80\"" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    depends_on:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "      - backend" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "    restart: unless-stopped" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "volumes:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            printf '%s\n' "  mysql_data:" >> ${{ secrets.DEPLOY_PATH }}/docker-compose.yml
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
